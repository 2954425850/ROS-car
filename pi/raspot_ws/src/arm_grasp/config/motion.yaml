# 机械臂语音动作的档位表 / 速度档 / 命名方向（设计 2026-10-31-arm-voice-motion-design.md §3 §5.1 §7）。
# 可手调；改完要 colcon build（装到 share/arm_grasp/config/）并重启 arm-grasp 才生效。

# 底座软限位（度）。用户 2026-10-31 确认 ±270°。底座 field = 度 × 1000/360，驱动钳位 ±1000。
base_limit_deg: 270

# 视线俯仰允许范围（度，下负）。超出 ⇒ 截到边上并说明「已经低到最低了」。
el_range_deg: [-90, 90]

# 每帧最短时长（ms）
min_frame_ms: 250

# 速度档 = 关节空间最大角速度（°/s）。t_ms = max(min_frame_ms, max|Δ关节°| / 档速 × 1000)
speeds:
  慢: 45
  正常: 100          # 2026-10-31 用户嫌慢：60→100（慢 30→45、快 120→160）
  快: 160
default_speed: 正常
oscillate_speed: 快          # oscillate 默认「快」（spec 里给了 speed 则以 spec 为准）

# 档位表。「到底」不在表里：turn = 到限位，shift/approach = 到可达边界。
amounts:
  turn:       {一点: 8, 一些: 20, 很多: 40}       # 度
  shift:      {一点: 2, 一些: 5, 很多: 10}        # cm
  approach:   {一点: 2, 一些: 5, 很多: 10}        # cm
  oscillate:  {一点: 8, 一些: 15, 很多: 25}       # 度（单侧幅度，围绕起始姿态 ±A）
default_amount: 一些          # 只说了方向、没说程度也没给数时用它
oscillate_times: 3            # 没说次数时来回几次

# shift/approach「到底」时沿该方向最多找多远（cm），实际挪多少由可达边界二分决定
max_travel_cm: 60

# 命名方向 → [方位 az, 俯仰 el]（度；az 左正 0=车头；el 下负 0=水平）
directions:
  前方: [0, -15]
  左边: [90, -15]
  右边: [-90, -15]
  左前: [45, -15]
  右前: [-45, -15]
  上方: [0, 30]
  地上: [0, -75]
  脚下: [0, -75]
  地上远处: [0, -40]
  后方: [180, -15]

# 夹爪 p1 field
gripper:
  张开: 240
  合上: 578
  半开: 400

# ---- 执行（motion_exec.run_motion，设计 §8）。缺的键用代码默认值 ----
exec:
  tol_joint: 8            # p2..p5 到位容差（field，1000/240 每度 ⇒ ≈1.9°）
  tol_base: 6             # 底座到位容差（field，1000/360 每度 ⇒ ≈2.2°）
  settle_n: 3             # 回读连续几拍在容差内算到位（回读 25Hz）
  timeout_extra_ms: 1500  # 每帧超时 = t_ms + 这个；超时不报错，记残差 ⇒ PARTIAL
  resend_after_ms: 600    # 发出后这么久回读完全没朝目标动 ⇒ 重发一次（防串口丢帧）。2026-10-31 实车：250 会误重发（回读滞后~150ms+舵机起步）
  max_resend: 1
  stall_n: 4              # 过了 t_ms 后回读连续这么多拍不动 ⇒ 舵机已停，收工（不再死等 timeout）
  stall_eps: 1.5          # 两拍间 field 变化 ≤ 这个算不动
  tol_joint_stall: 16     # 停住时的放宽容差。2026-10-31 实车：腕带载下垂停在差 11.5 field（≈3°）
  tol_base_stall: 14      # 底座松量 ~3.7°≈10 field；摇头时每端停在差 ~8 field，原来每段都等满 1.75s
  moved_eps: 3            # 朝目标挪了不到这么多 field 视为"没动"
  freeze_t_ms: 100        # 取消（唤醒词）时冻结帧的 t_ms
  fb_lost_s: 1.0          # 执行中连续这么久没有可信回读 ⇒ NO_FEEDBACK
  # normal_t_ms 不在这里：用 arm_grasp_server 的参数 normal_arm_t_ms（和抓取同一个还原值）

# ---- 状态描述（arm/describe、Result.state_json）里的夹爪判据（p1 读回 field）----
state:
  grip_open_max: 300      # ≤ 这个 = 张开（张开指令 240）
  grip_closed_min: 545    # ≥ 这个 = 合上（空爪合到底读回 559，指令 578）
  grip_holding_min: 400   # 读回在 (400, 545) 且最近一次夹爪指令是合上 = 夹着东西
  grip_hold_gap_max: 120  # 读回比夹爪指令小 0~120 = 被物体挡住 ⇒ 动作/冻结时保持指令值，不松爪
