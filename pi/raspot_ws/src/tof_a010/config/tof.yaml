# A010 ToF 配置 —— ★ **单一真源**。
# `tof_node`（发布端）和 `tof_client`（抓取链路取数）读的是**同一个文件**。
# 分两处一定会飘：标定完改了 map，节点里对、抓取用的还是旧的，
# 症状是「看着对、落点偏」，而且极难查。
#
# 改完不用重启节点（客户端每次调用都重读），但**节点自己的参数是启动时读的**。

# ---- 设备 ----------------------------------------------------------------
# udev 稳定名（见 /etc/udev/rules.d/99-tof-a010.rules）。
# 模块 = SIPEED Meta Sense Lite，挂在 FT2232D 双通道 UART 上，
# **通道 A（interface 00）= /dev/ttyUSB0 才是数据口**，ttyUSB1 是通道 B，不用。
device: /dev/a010
baud: 115200            # ★ Pi 侧走 USB，115200 实测就有 9.0 fps，**不需要**切 921600
                        #   （K230 侧走真 UART 时是必须切的，那是另一回事）

# ---- 模块设置（每次上电都要重设：掉电不保存，开机回默认 BAUD=2/DISP=1）----
# ★ USB 位（2）是必须的，写 5（LCD|UART）会**一个字节都收不到**，而且屏还是亮的。
#
# 2026-10-14：从 3 改成 2 —— **把 LCD 关掉**。
#   起因：这台 Pi 在真机上反复报 `Undervoltage detected`（4 小时 9 次），
#   同时 USB 设备成批掉线（TOF 模块 2 次、机械臂串口 2 次）。怀疑一半电流被
#   背光吃掉，做 A/B 对照。顺便 LCD 关了也不会再有"屏卡死不动"这个迷惑现象
#   （那个现象本身就是掉压复位的症状）。
#   → 如果掉线明显减少，就坐实是供电；如果照样掉，说明另有原因（见 docs）。
disp_mode: 2            # 2 = 只有 USB；3 = LCD|USB（背光常亮，更费电）
binn: 1                 # 1 = 100x100 满分辨率

# ---- 深度换算 ------------------------------------------------------------
# payload 每像素 1 字节**计数**，mm = count * unit。
# 2026-10-14 真机验过：同一场景 UNIT=4/2/1/8 的 min 计数 = 12/24/48/6 ⇒ 折算全是 48mm。
unit_mm_per_count: 4.0  # 满量程 255*4 = 1020mm，覆盖 15cm~1m 的抓取包络
min_mm: 150.0           # 量程下限。★ 实测：模块前面**什么都没有**时最左一列也恒读 12 计数
                        #   (=48mm) ⇒ 近场假回波是**模块自身的**，这一刀必须留着。
val_max: 254            # > 254 当无效（255 = 饱和/超量程）；0 = 无回波，也无效

# ★ 基准偏置：ToF 报的是**它自己的传感器平面**的深度，而 `geom` 要的是**相机光心**
#   的轴向深度。两者物理上差一截（模块外壳 + 两板子不共轴），是个**系统性常数**。
#   正值 = 认为目标比 ToF 读到的**更远** ⇒ 目标点 z 更低 ⇒ 臂扎得更深。
#
#   2026-10-20 实测定位：抓取稳定停在目标上方 ~2cm，臂本身完全按指令到位
#   （爪尖→目标点 3.07mm），所以是**目标点本身高了一截**，不是伺服问题。
#   量尺那 21.3mm 截距正是这个量级。
#
#   ⚠️ 只加在 `tof_client`（喂给 geom 的那一路），**不加在话题 `/tof/depth` 上** ——
#      话题要保持是真值（标定、排障、以后别的消费者都要它）。
offset_mm: 20.0

# ---- 框 → ToF 区域 -------------------------------------------------------
pad: 0.06               # 框四周多留的余量（归一化）

# ★★ 必须用 **6 参**（含旋转），4 参（ax/bx/ay/by）在这里**不够** ——
#     实测 9 点拟合：4 参 rms 17.2 像素 / 最差 31.8；6 参 rms 3.1 / 最差 6.6。
#     原因：ToF 相对相机**转了 90°**（模块是侧着装的）。
#     x'(ToF列) = 0.7515 - 0.6456*y_cam   ← 只跟相机竖直有关，系数为负
#     y'(ToF行) = 0.1026 + 0.8550*x_cam   ← 只跟相机水平有关
#     自检：相机底部(y=1) → ToF 列 0.10，正好是那条 152mm 近场区（= 夹爪）
# 2026-10-14 标定，样本 ~/tof-map2.json（9 点，球摆 3×3）。
map:
  a11: -0.038007
  a12: -0.645554
  a13: 0.751530
  a21: 0.854962
  a22: -0.023271
  a23: 0.102597
exclude: []             # ToF 归一化排除区 [[l,t,r,b], ...]，默认空。
                        # 150mm 下限已是第一道保险，这个只是第二道。

# ---- 新鲜度 --------------------------------------------------------------
max_age_s: 0.25         # 深度超过这么久就当没拿到。★ 深度必须对应这一拍的手臂姿态，
                        #   拿 1 秒前的深度去乘射线没意义 —— 那时臂还在别处。

# ---- 点云（rviz 用）------------------------------------------------------
fx: 71.4                # 由 FOV H70°xV60° 在 100x100 上推得：
fy: 86.6                #   fx = 50/tan(35°) = 71.4,  fy = 50/tan(30°) = 86.6
cx: 49.5
cy: 49.5
publish_cloud: false    # 默认关；rviz 里看才开（-p publish_cloud:=true）
