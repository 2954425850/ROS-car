# ============================================================================
# 机器人上位机 · Nginx 站点配置
# 落点：/etc/nginx/sites-available/robot-upper  → 软链到 sites-enabled/
#
# 三条链路的分工：
#   /            → 前端静态文件（SPA 路由回退）
#   /api/        → 后端 REST
#   /ws/         → 后端 WebSocket 升级（★ token 在 query，必须关 access_log）
#   /video/      → 后端 chunked 视频扇出（★ 必须关缓冲，否则延迟暴涨）
#
# 8555 / 8556 不在这里 —— 它们是后端直接监听的公网 TCP 收流端口，
# 不走 Nginx。安全组 + ufw 放行即可（见部署手册 §6）。
# ============================================================================

# ---------- 后端 upstream（★ keepalive 只对短请求有意义）----------
# 摇杆指令走 REST，前端节流 16ms 时可达 60 次/秒。没有 keepalive 时，
# 每次请求都要新建一条到后端的 TCP 连接 —— 60/s 会持续堆出大量 TIME_WAIT。
# ⚠️ /ws/ 与 /video/ 是长连接，keepalive 对它们没有意义，继续直连。
upstream robot_backend {
    server 127.0.0.1:8080;
    keepalive 32;
    keepalive_requests 10000;   # 高频短请求下别过早断连重建
    keepalive_timeout 60s;
}

# ---------- 80：只做跳转，不提供服务 ----------
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # 允许 ACME challenge 走明文（将来换真证书时用得上）
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- 443：唯一对外入口 ----------
server {
    # ★ Ubuntu 22.04 自带的是 nginx 1.18，**不支持** 1.25.1+ 的独立 `http2 on;` 指令，
    #   必须写成 listen 参数的 http2（否则 nginx -t 直接报 unknown directive "http2"）。
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;                       # 无域名，用 IP 访问

    # 自签证书（无域名，无法用 Let's Encrypt）。浏览器会提示不受信任，
    # 这是 IP 直访 HTTPS 的固有代价，验收 J2 用 curl -k 验证。
    # 生成命令见 docs/部署手册-云服务器.md §3。
    ssl_certificate     /etc/nginx/ssl/robot-upper.crt;
    ssl_certificate_key /etc/nginx/ssl/robot-upper.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:4m;
    ssl_session_timeout 1h;

    # ★ 视频链路对 Nagle 敏感：小包被合并会直接变成延迟。
    #   这**本来就是 nginx 的默认值**，显式写出来是为了防止将来有人在 http{} 层
    #   全局设成 off（那会把视频链路的延迟从毫秒级推到几十毫秒）。
    tcp_nodelay on;
    # tcp_nopush 保持默认 off —— 它是 TCP_CORK，会攒满一个 MSS 才发，对实时流是反效果。

    # 安全响应头（与后端 SecurityHeadersFilter 保持一致）
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    root /var/www/robot-upper;
    index index.html;
    charset utf-8;

    client_max_body_size 8m;             # 一键拍照的 base64 图片

    # ---------- 前端 SPA：深链接刷新不 404（验收 J5）----------
    location / {
        try_files $uri $uri/ /index.html;
        # 带 hash 的构建产物可以长缓存；index.html 必须每次校验
        location = /index.html {
            add_header Cache-Control "no-cache" always;
        }
        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }
    }

    # ---------- REST ----------
    location /api/ {
        proxy_pass http://robot_backend;
        proxy_http_version 1.1;
        # ★ 配合 upstream keepalive：必须清掉 Connection 头，否则后端在每次响应后关连接，
        #   keepalive 池形同虚设。
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ---------- WebSocket（验收 J3 升级透传 / J4 关日志）----------
    location /ws/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;    # ★ WS 必须
        proxy_set_header Connection "upgrade";        # ★ WS 必须
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;                     # ★ 长连接别被掐
        proxy_send_timeout 3600s;

        # ★★ token 在 query 里（浏览器 WS 无法自定义 Header），
        #     必须关日志否则 token 明文落盘（验收 J4）
        access_log off;
    }

    # ---------- 视频：chunked 透传，禁缓冲 ----------
    # K230 断连由后端扇出层吸收，浏览器会话不断开，这里不需要特殊处理。
    #
    # ⚠️ 未验证的疑点：本 server 跑在 HTTP/2 上（见上面的 listen ... http2）。
    #   HTTP/2 有流控窗口（默认 64KB），且与 REST/WS 复用同一条 TCP 连接，
    #   理论上可能给这条持续 chunked 流引入额外延迟或与 API 请求互相影响。
    #   现在 REST 已提到 60 次/秒，这个交互更值得怀疑。
    #   **尚未实测** —— 等有真实码流时，用 http/1.1 与 http/2 各抓一段对比即可判定。
    #   若确认有害，改法是给视频单开一个只跑 http/1.1 的 server 块（nginx 不支持按 location 选协议）。
    location /video/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_buffering off;              # ★ 否则延迟暴涨到秒级
        proxy_request_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        access_log off;
    }
}
